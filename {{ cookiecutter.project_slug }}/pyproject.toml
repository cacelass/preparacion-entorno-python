[project]
name = "{{ cookiecutter.project_module_name }}"
version = "{{ cookiecutter.project_version }}"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest",
    "sphinx",
    "sphinx-rtd-theme",
    "ty",
]

ml = [
    "numpy",
    "pandas",
    "matplotlib",
    "opencv-python",
    "torch",
    "torchvision",
    "torchaudio",
]

db = [
    "chromadb",
]

vision = [
    "opencv-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_module_name }}"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I"]
fix = true
